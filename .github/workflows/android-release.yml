name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          mkdir -p release-signing
          printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n ' | base64 --decode > release-signing/openwrt-manager-release.jks
          test -s release-signing/openwrt-manager-release.jks
          keytool -list -keystore release-signing/openwrt-manager-release.jks -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          cat > signing.properties <<EOF2
          storeFile=release-signing/openwrt-manager-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF2
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWrtManager-release
          path: app/build/outputs/apk/release/app-release.apk
